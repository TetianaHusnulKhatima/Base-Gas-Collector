<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>3. Gas Collector</title><style>body{background:#050b14;color:white;font-family:sans-serif;text-align:center;}canvas{background:#0a1128;border:2px solid #0052ff;}</style></head>
<body>
<h1>3. Base Gas Collector</h1>
<h3 id="s">Собрано Gwei: 0</h3>
<canvas id="c" width="300" height="250"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let s=0, gx=150, gy=100;
document.getElementById('c').onclick = () => { s++; document.getElementById('s').innerText='Собрано Gwei: '+s; gx=Math.random()*260+20; gy=Math.random()*200+20; };
function loop() {
    ctx.clearRect(0,0,300,250);
    ctx.fillStyle='#0052FF'; ctx.beginPath(); ctx.arc(gx, gy, 15, 0, 7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillText('GAS', gx-11, gy+4);
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
